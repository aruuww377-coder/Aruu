{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Login — POS</title>
    <link rel="stylesheet" href="{% static 'css/pos.css' %}">
    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #e0f2fe 0%, #eef5fb 100%);
            padding: 24px;
        }
        .login-card {
            width: min(420px, 100%);
            background: white;
            border-radius: 28px;
            padding: 36px 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }
        .login-card h1 {
            margin: 0 0 24px;
            text-align: center;
            font-size: 2rem;
        }
        .login-card label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 700;
        }
        .login-card input {
            width: 100%;
            padding: 14px 14px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.5);
            background: #f8fafc;
            margin-bottom: 18px;
        }
        .login-card button {
            width: 100%;
            padding: 14px 0;
            border-radius: 14px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .login-card button:hover {
            opacity: 0.95;
        }
        .errors {
            color: #dc2626;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>Welcome Welcome </h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if form.errors %}
            <p class="errors">Invalid username or password. Please try again.</p>
            {% endif %}
            <button type="submit">Log In</button>
        </form>
    </div>
</div>
</body>
</html>
